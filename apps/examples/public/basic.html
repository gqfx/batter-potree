<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Example - Better-Potree</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #viewer {
      width: 100vw;
      height: 100vh;
    }

    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.9);
      padding: 15px;
      border-radius: 5px;
      max-width: 300px;
    }

    h2 {
      margin-bottom: 10px;
      font-size: 16px;
    }

    button {
      margin: 5px 5px 5px 0;
      padding: 8px 15px;
      cursor: pointer;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 3px;
    }

    button:hover {
      background: #0056b3;
    }

    #stats {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px;
      border-radius: 5px;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="viewer"></div>

  <div id="controls">
    <h2>Basic Example</h2>
    <button onclick="loadPointCloud()">Load Point Cloud</button>
    <button onclick="fitToScreen()">Fit to Screen</button>
    <button onclick="toggleEDL()">Toggle EDL</button>
    <button onclick="toggleStats()">Toggle Stats</button>
  </div>

  <div id="stats" style="display: none;">
    <div>FPS: <span id="fps">0</span></div>
    <div>Points: <span id="points">0</span></div>
    <div>Nodes: <span id="nodes">0</span></div>
  </div>

  <script type="module">
    import { PointCloudViewer } from '@better-potree/viewer';

    let viewer;
    let edlEnabled = true;

    // Initialize viewer
    function init() {
      viewer = new PointCloudViewer({
        container: document.getElementById('viewer'),
        pointBudget: 2_000_000,
        fov: 60,
        edlEnabled: true,
        showStats: false
      });

      // Event listeners
      viewer.on('pointcloud-loaded', (pc) => {
        console.log('Loaded:', pc.name);
        updateStats();
      });

      viewer.on('render-end', (stats) => {
        updateStats(stats);
      });

      // Start rendering
      viewer.start();

      console.log('Viewer initialized');
    }

    // Load example point cloud
    window.loadPointCloud = async function() {
      try {
        await viewer.loadPointCloud({
          url: '/data/example/metadata.json',
          name: 'Example Point Cloud'
        });

        viewer.fitToScreen();
      } catch (error) {
        console.error('Failed to load point cloud:', error);
        alert('Failed to load point cloud. Make sure the data is available.');
      }
    };

    // Fit camera to point cloud
    window.fitToScreen = function() {
      viewer.fitToScreen();
    };

    // Toggle EDL
    window.toggleEDL = function() {
      edlEnabled = !edlEnabled;
      viewer.setEDL({ enabled: edlEnabled });
      console.log('EDL:', edlEnabled ? 'ON' : 'OFF');
    };

    // Toggle stats
    window.toggleStats = function() {
      const stats = document.getElementById('stats');
      stats.style.display = stats.style.display === 'none' ? 'block' : 'none';
    };

    // Update stats display
    function updateStats(stats = {}) {
      document.getElementById('fps').textContent = Math.round(stats.fps || 0);
      document.getElementById('points').textContent = (stats.visiblePoints || 0).toLocaleString();
      document.getElementById('nodes').textContent = stats.visibleNodes || 0;
    }

    // Initialize on load
    init();
  </script>
</body>
</html>
